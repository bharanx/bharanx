<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 45" width="100%" height="45">
  <defs>
    <style>
      @keyframes track-move {
        0% { transform: translateX(0); }
        100% { transform: translateX(-500px); }
      }
      .marquee-track {
        animation: track-move 12s linear infinite;
      }
      .font-mono {
        font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- Marquee Background Box -->
  <rect x="0" y="2" width="800" height="41" fill="#CCFF00" stroke="#000000" stroke-width="4" />

  <!-- Clip Container to Keep Marquee Text Inside Bounds -->
  <g clip-path="url(#marquee-clip)">
    <clipPath id="marquee-clip">
      <rect x="4" y="4" width="792" height="37" />
    </clipPath>

    <g class="marquee-track">
      <text x="0" y="27" class="font-mono" font-size="14" font-weight="900" fill="#0F0F12" letter-spacing="2">
        BUILD ➔ BREAK ➔ LEARN ➔ REPEAT ➔ SECURE ➔ RESEARCH ➔ BUILD ➔ BREAK ➔ LEARN ➔ REPEAT ➔ SECURE ➔ RESEARCH ➔ BUILD ➔ BREAK ➔ LEARN ➔ REPEAT ➔ SECURE ➔ RESEARCH ➔
      </text>
    </g>
  </g>
</svg>
