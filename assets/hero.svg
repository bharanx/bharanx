<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulse-dot {
        0% { fill: #CCFF00; r: 5; }
        50% { fill: #FF4444; r: 7; }
        100% { fill: #CCFF00; r: 5; }
      }
      @keyframes spin-star {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .blinking-cursor { animation: blink 1s infinite; }
      .live-dot { animation: pulse-dot 2s infinite; }
      .rotating-star { transform-origin: 730px 65px; animation: spin-star 12s linear infinite; }
      .font-impact { font-family: 'Impact', 'Arial Black', 'Trebuchet MS', sans-serif; }
      .font-mono { font-family: 'Fira Code', 'Consolas', 'Courier New', monospace; }
      .font-sans { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Hard Neo-Brutalist Shadow -->
  <rect x="12" y="12" width="776" height="236" fill="#CCFF00" rx="0" />

  <!-- Main Card Container -->
  <rect x="4" y="4" width="776" height="236" fill="#0F0F12" stroke="#000000" stroke-width="4" rx="0" />

  <!-- Top Decorative Header Bar -->
  <rect x="4" y="4" width="776" height="40" fill="#1A1A1E" stroke="#000000" stroke-width="4" />
  
  <!-- Window Control Buttons (Brutalist style) -->
  <rect x="20" y="16" width="16" height="16" fill="#FF5F56" stroke="#000000" stroke-width="2" />
  <rect x="44" y="16" width="16" height="16" fill="#FFBD2E" stroke="#000000" stroke-width="2" />
  <rect x="68" y="16" width="16" height="16" fill="#27C93F" stroke="#000000" stroke-width="2" />

  <!-- Live Status Badge -->
  <rect x="520" y="12" width="244" height="24" fill="#0F0F12" stroke="#CCFF00" stroke-width="2" />
  <circle class="live-dot" cx="536" cy="24" r="5" />
  <text x="550" y="29" class="font-mono" font-size="11" font-weight="700" fill="#CCFF00" letter-spacing="1">STATUS: BUILDING &amp; RESEARCHING</text>

  <!-- Main Title Area -->
  <text x="32" y="102" class="font-mono" font-size="14" font-weight="700" fill="#CCFF00" letter-spacing="2">HELLO WORLD, I'M</text>
  <text x="30" y="152" class="font-impact" font-size="52" font-weight="900" fill="#FAFAFA" letter-spacing="2">BHARANIDHARAN S</text>

  <!-- Animated Brutalist Star Badge in corner -->
  <g class="rotating-star">
    <path d="M 730 45 L 736 59 L 750 65 L 736 71 L 730 85 L 724 71 L 710 65 L 724 59 Z" fill="#CCFF00" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Tagline Banner Box -->
  <rect x="32" y="172" width="720" height="48" fill="#CCFF00" stroke="#000000" stroke-width="3" />
  <text x="48" y="202" class="font-mono" font-size="13" font-weight="800" fill="#0F0F12" letter-spacing="0.5">CYBERSECURITY STUDENT &amp; SUPPLY-CHAIN SECURITY RESEARCHER<tspan class="blinking-cursor">_</tspan></text>
</svg>
